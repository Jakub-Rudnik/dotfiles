# Minimal black-and-white lock screen matching the Quickshell theme.
# Unlock with your Linux account password, then press Enter.
$font = Sans

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(000000)
}

label {
    monitor =
    text = $TIME
    color = rgb(ffffff)
    font_size = 80
    font_family = $font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%d.%m.%Y"
    color = rgb(b0b0b0)
    font_size = 20
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgb(ffffff)
    font_size = 20
    font_family = $font
    position = 0, -10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    rounding = 5
    inner_color = rgb(101010)
    outer_color = rgb(404040)
    font_color = rgb(ffffff)
    check_color = rgb(ffffff)
    fail_color = rgb(ff6666)
    capslock_color = rgb(ffcc66)
    font_family = $font
    placeholder_text = Hasło…
    fail_text = Nieprawidłowe hasło ($ATTEMPTS)
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.3
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = Wpisz hasło i naciśnij Enter
    color = rgb(b0b0b0)
    font_size = 14
    font_family = $font
    position = 0, -140
    halign = center
    valign = center
}
