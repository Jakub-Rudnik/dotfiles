# Idle policy: dim -> lock -> screen off -> suspend.
# Apps holding an idle inhibitor (video playback, calls) pause the timers.

$lock = ~/.config/hypr/lock.sh

general {
    lock_cmd = $lock
    before_sleep_cmd = loginctl lock-session      # lid close / manual suspend also lock
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false
}

# 5 min: dim the panel (restored on activity).
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 10 min: lock.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 10.5 min: screens off.
listener {
    timeout = 630
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 30 min: suspend.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
